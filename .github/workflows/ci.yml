name: CPU checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: python -m pip install ruff==0.15.16 mypy==2.3.0
      - name: Ruff lint
        run: python -m ruff check src/ tools/ tests/
      - name: Mypy
        run: python -m mypy src/game_cls

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Pytest (includes 2-process gloo distributed evaluator)
        run: python -m pytest
      - name: Wheel build smoke
        run: >-
          python -m pip wheel . -w dist --no-deps
          && test -n "$(ls dist/*.whl 2>/dev/null)"
      - name: Synthetic training smoke
        run: >-
          python tools/train.py --config configs/recipes/example_debug.yaml
          train.max_steps=2
          evaluation.val_quick_every_steps=1
          evaluation.val_full_every_steps=2
          checkpoint.save_last_every_steps=1
          experiment.output_dir=runs/ci_smoke
