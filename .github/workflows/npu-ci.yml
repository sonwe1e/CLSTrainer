name: NPU acceptance (self-hosted)

# Real-Ascend gate (step4 P0-4). Requires an internal self-hosted runner
# tagged [self-hosted, npu] with the CANN + torch + torch_npu environment
# matching this repo's expected stack. This workflow cannot run on
# GitHub-hosted runners and is intentionally dispatch-only so it never
# blocks ordinary CPU PRs.

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Smoke training steps"
        required: false
        default: "100"

jobs:
  device-ops:
    runs-on: [self-hosted, npu]
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        run: python -m pip install -e .
      - name: Device operator probe (bincount/scatter_add_/nonzero/index_select/GradScaler)
        run: python tools/check_npu_ops.py

  npu-1p:
    runs-on: [self-hosted, npu]
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        run: python -m pip install -e .
      - name: 1P staged smoke (forward/backward/BF16/eval/save+resume)
        run: |
          bash scripts/smoke_npu_1p.sh
      - name: 1P full training smoke
        run: |
          python tools/train.py --config configs/npu_1p.yaml \
            train.max_steps=${{ github.event.inputs.max_steps }} \
            experiment.output_dir=runs/npu_ci_1p

  npu-8p:
    runs-on: [self-hosted, npu]
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        run: python -m pip install -e .
      - name: 8P HCCL smoke (DDP / group metrics / checkpoint)
        run: |
          bash scripts/smoke_npu_8p.sh
      - name: 8P full training smoke
        run: |
          torchrun --standalone --nnodes=1 --nproc_per_node=8 \
            tools/train.py --config configs/npu_8p.yaml \
            train.max_steps=${{ github.event.inputs.max_steps }} \
            experiment.output_dir=runs/npu_ci_8p
