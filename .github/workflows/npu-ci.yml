name: NPU acceptance (self-hosted)

# Real-Ascend gate (step4 P0-4, step6 P0-4). Requires an internal
# self-hosted runner tagged [self-hosted, npu] with the CANN + torch +
# torch_npu environment matching this repo's expected stack. This workflow
# cannot run on GitHub-hosted runners.
#
# Two tiers, because they answer different questions:
#
#   preflight  - synthetic data only. Any Ascend runner can pass it, so a
#                failure means the NPU stack itself (operators, BF16, HCCL,
#                DDP, save/resume) is broken. This is the repeatable gate.
#   production - real indexes and checkpoints. Only a provisioned runner can
#                pass it, so each job first asserts its prerequisites and
#                names the missing path instead of dying on a FileNotFound
#                halfway through training.
#
# Dispatch-only for the production tier so it never blocks ordinary CPU PRs;
# the preflight also runs weekly so the stack cannot rot unnoticed between
# manual runs.

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Smoke training steps for the production jobs"
        required: false
        default: "100"
      run_production:
        description: "Run the data-dependent 1P/8P jobs (needs a provisioned runner)"
        required: false
        default: "true"
      # The production recipe is a TEMPLATE: it ships
      # model.factory=REPLACE_ME_PACKAGE.module:build_model and
      # model.checkpoint_path=REPLACE_ME/path/to/base_model.pt. A clean checkout
      # therefore cannot pass the production tier no matter how well the runner
      # is provisioned -- provisioning supplies data, not config. These inputs
      # are how the real values reach the job. Each falls back to a repository
      # variable so a provisioned runner does not retype them every dispatch.
      production_config:
        description: "Production recipe path (default: vars.NPU_PRODUCTION_CONFIG or the in-repo template)"
        required: false
        default: ""
      model_factory:
        description: "model.factory override, e.g. my_pkg.models:build_model (default: vars.NPU_MODEL_FACTORY)"
        required: false
        default: ""
      checkpoint_path:
        description: "model.checkpoint_path override (default: vars.NPU_CHECKPOINT_PATH)"
        required: false
        default: ""
      index_root:
        description: "Directory holding the index bundle; rebases data.*_index and data.audit_path (default: vars.NPU_INDEX_ROOT)"
        required: false
        default: ""
  schedule:
    # Preflight only: run_production is unset on a schedule.
    - cron: "43 18 * * 0"

concurrency:
  # One NPU run at a time -- the jobs share the runner's devices, and two
  # concurrent 8P runs would fight over all eight of them.
  group: npu-acceptance
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- preflight
  device-ops:
    name: preflight / device operators
    runs-on: [self-hosted, npu]
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        # --no-deps: never let pip swap the runner's pinned torch/torch_npu.
        run: python -m pip install -e . --no-deps
      - name: Report the NPU stack
        run: |
          python - <<'PY'
          import torch, torch_npu
          print("torch", torch.__version__)
          print("torch_npu", torch_npu.__version__)
          print("npu available", torch.npu.is_available())
          print("device count", torch.npu.device_count())
          PY
      - name: Device operator probe (bincount/scatter_add_/nonzero/index_select/GradScaler)
        run: python tools/check_npu_ops.py
      - name: Doctor on the synthetic config
        run: cls-trainer doctor --config configs/recipes/npu_synthetic_smoke.yaml

  preflight-1p:
    name: preflight / 1P synthetic
    runs-on: [self-hosted, npu]
    needs: device-ops
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        # --no-deps: never let pip swap the runner's pinned torch/torch_npu.
        run: python -m pip install -e . --no-deps
      - name: 1P synthetic train + eval + checkpoint
        run: |
          set -euo pipefail
          unset RANK LOCAL_RANK WORLD_SIZE MASTER_ADDR MASTER_PORT
          export ASCEND_RT_VISIBLE_DEVICES="${ASCEND_RT_VISIBLE_DEVICES:-0}"
          python -u tools/train.py --run-mode fixed \
            --config configs/recipes/npu_synthetic_smoke.yaml \
            experiment.output_dir=runs/npu_preflight_1p
      - name: 1P synthetic resume from the saved checkpoint
        run: |
          set -euo pipefail
          unset RANK LOCAL_RANK WORLD_SIZE MASTER_ADDR MASTER_PORT
          export ASCEND_RT_VISIBLE_DEVICES="${ASCEND_RT_VISIBLE_DEVICES:-0}"
          # --run-mode fixed writes checkpoints directly under output_dir, so
          # there is no extra date/run subdirectory level.
          checkpoint=$(ls -t runs/npu_preflight_1p/checkpoints/checkpoint_last.pth | head -1)
          echo "resuming from ${checkpoint}"
          python -u tools/train.py --run-mode fixed \
            --config configs/recipes/npu_synthetic_smoke.yaml \
            train.max_steps=30 \
            train.steps_per_epoch=30 \
            train.resume_path="${checkpoint}" \
            experiment.output_dir=runs/npu_preflight_1p_resume
      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-preflight-1p
          path: |
            runs/npu_preflight_1p/**/*.json
            runs/npu_preflight_1p/**/*.log
            runs/npu_preflight_1p_resume/**/*.json
            runs/npu_preflight_1p_resume/**/*.log
          if-no-files-found: warn

  preflight-8p:
    name: preflight / 8P synthetic HCCL
    runs-on: [self-hosted, npu]
    needs: preflight-1p
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        # --no-deps: never let pip swap the runner's pinned torch/torch_npu.
        run: python -m pip install -e . --no-deps
      - name: 8P synthetic HCCL (DDP / group metric reduction / checkpoint)
        run: |
          set -euo pipefail
          torchrun --standalone --nnodes=1 --nproc_per_node=8 \
            tools/train.py --run-mode fixed \
            --config configs/recipes/npu_synthetic_smoke.yaml \
            distributed.enabled=true \
            distributed.backend=hccl \
            train.max_steps=40 \
            train.steps_per_epoch=40 \
            experiment.output_dir=runs/npu_preflight_8p
      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-preflight-8p
          path: |
            runs/npu_preflight_8p/**/*.json
            runs/npu_preflight_8p/**/*.log
          if-no-files-found: warn

  # --------------------------------------------------------------- production
  npu-1p:
    name: production / 1P
    runs-on: [self-hosted, npu]
    needs: preflight-8p
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_production == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        # --no-deps: never let pip swap the runner's pinned torch/torch_npu.
        run: python -m pip install -e . --no-deps
      - name: Resolve production overrides
        # The recipe ships REPLACE_ME placeholders, so a clean checkout cannot
        # train no matter how well the runner is provisioned. Fail here, in
        # under a second, naming the input to set -- rather than dying on an
        # import error or FileNotFound halfway through training.
        id: resolve
        env:
          CONFIG: ${{ github.event.inputs.production_config || vars.NPU_PRODUCTION_CONFIG || 'configs/recipes/game_cls_production.yaml' }}
          FACTORY: ${{ github.event.inputs.model_factory || vars.NPU_MODEL_FACTORY }}
          CHECKPOINT: ${{ github.event.inputs.checkpoint_path || vars.NPU_CHECKPOINT_PATH }}
          INDEX_ROOT: ${{ github.event.inputs.index_root || vars.NPU_INDEX_ROOT }}
        run: bash scripts/resolve_npu_production_overrides.sh
      - name: Assert the runner is provisioned
        # doctor already FAILs on a missing index / audit / checkpoint, so it
        # names the missing path before any training starts.
        run: |
          cls-trainer doctor --config "${{ steps.resolve.outputs.config }}" \
            profile=npu_1p experiment.output_dir=runs/game_cls_1p \
            ${{ steps.resolve.outputs.overrides }}
      - name: 1P staged smoke (forward/backward/BF16/eval/save+resume)
        env:
          CONFIG: ${{ steps.resolve.outputs.config }}
          EXTRA_OVERRIDES: ${{ steps.resolve.outputs.overrides }}
        run: bash scripts/smoke_npu_1p.sh
      - name: 1P full training smoke
        run: |
          python tools/train.py --config "${{ steps.resolve.outputs.config }}" profile=npu_1p \
            train.max_steps=${{ github.event.inputs.max_steps }} \
            scheduler.warmup_steps=${{ github.event.inputs.warmup_steps }} \
            experiment.output_dir=runs/npu_ci_1p \
            ${{ steps.resolve.outputs.overrides }}
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-ci-1p
          path: |
            runs/npu_ci_1p/**/*.json
            runs/npu_ci_1p/**/*.csv
            runs/npu_ci_1p/**/*.log
          if-no-files-found: warn

  npu-8p:
    name: production / 8P
    runs-on: [self-hosted, npu]
    needs: npu-1p
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_production == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install package (do not replace torch/torch_npu)
        # --no-deps: never let pip swap the runner's pinned torch/torch_npu.
        run: python -m pip install -e . --no-deps
      - name: Resolve production overrides
        id: resolve
        env:
          CONFIG: ${{ github.event.inputs.production_config || vars.NPU_PRODUCTION_CONFIG || 'configs/recipes/game_cls_production.yaml' }}
          FACTORY: ${{ github.event.inputs.model_factory || vars.NPU_MODEL_FACTORY }}
          CHECKPOINT: ${{ github.event.inputs.checkpoint_path || vars.NPU_CHECKPOINT_PATH }}
          INDEX_ROOT: ${{ github.event.inputs.index_root || vars.NPU_INDEX_ROOT }}
        run: bash scripts/resolve_npu_production_overrides.sh
      - name: Assert the runner is provisioned
        # Must carry the SAME profile and output_dir the training step below
        # uses. Without them this validated the default profile while the next
        # step trained 8P, so doctor green-lit a config that was never run.
        run: |
          cls-trainer doctor --config "${{ steps.resolve.outputs.config }}" \
            profile=npu_8p experiment.output_dir=runs/npu_ci_8p \
            ${{ steps.resolve.outputs.overrides }}
      - name: 8P HCCL smoke (DDP / group metrics / checkpoint)
        env:
          CONFIG: ${{ steps.resolve.outputs.config }}
          EXTRA_OVERRIDES: ${{ steps.resolve.outputs.overrides }}
        run: bash scripts/smoke_npu_8p.sh
      - name: 8P full training smoke
        run: |
          torchrun --standalone --nnodes=1 --nproc_per_node=8 \
            tools/train.py --config "${{ steps.resolve.outputs.config }}" profile=npu_8p \
            train.max_steps=${{ github.event.inputs.max_steps }} \
            scheduler.warmup_steps=${{ github.event.inputs.warmup_steps }} \
            experiment.output_dir=runs/npu_ci_8p \
            ${{ steps.resolve.outputs.overrides }}
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-ci-8p
          path: |
            runs/npu_ci_8p/**/*.json
            runs/npu_ci_8p/**/*.csv
            runs/npu_ci_8p/**/*.log
          if-no-files-found: warn
