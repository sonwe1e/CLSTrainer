# Task profile: dual-frame binary classification.
#
# Canonical defaults shared by every recipe of this task. Unlike a hard
# contract, EVERY field here is a default: recipes, presets and CLI
# overrides may change them, and the framework must stay consistent with
# whatever the resolved configuration says. The code-level invariants
# (input shape checks, delta-2 evaluation pairs, strict non-cls
# checkpoint loading) are enforced by code, not by this file.
decision:
  threshold: 0.99

pair:
  test_delta: 2

model:
  num_classes: 2
  trainable_rules:
    cls_head:
      pattern: "cls"
      lr_scale: 1.0
      unfreeze_at_step: 0
      priority: 0
  freeze_backbone_batchnorm_stats: true
  freeze_cls_batchnorm_stats: true
  require_pretrained_backbone: true

data:
  width: 448
  height: 208
  channels: 3
  strict_audit: true

loss:
  cross_entropy_weight: 1.0
  threshold_loss_weight: 0.20
  threshold_safety_margin: 0.20
  threshold_temperature: 0.50
  threshold_warmup_ratio: 0.10
  threshold_ramp_ratio: 0.20
