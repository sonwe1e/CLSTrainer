experiment:
  name: cpu_baseline
  output_dir: runs
  seed: 20260728

data:
  backend: image
  image:
    train_root: REPLACE_ME/train
    test_root: REPLACE_ME/test
    strict_filenames: true
  video:
    train_root: null
    test_root: null
    extensions: [".mp4"]
    chunk_frames: 128
    cache_chunks: 2
    ffmpeg_bin: ffmpeg
    ffprobe_bin: ffprobe
    ffmpeg_threads: 2
  val_ratio: 0.10
  train_delta_range: [2, 2]
  train_delta_probabilities: null
  eval_delta: 2
  image_size: [208, 448]

augment:
  enabled: false
  horizontal_flip_p: 0.0
  crop_scale: [1.0, 1.0]
  brightness: 0.0
  contrast: 0.0
  saturation: 0.0
  gamma: [1.0, 1.0]
  color_shared: true
  noise_std: 0.0
  erase_p: 0.0
  erase_scale: [0.02, 0.10]

loss:
  type: cross_entropy
  gamma: 1.5
  alpha: null

sampler:
  enabled: false
  class_probability: [0.5, 0.5]
  game_balance_alpha: 0.5
  samples_per_epoch: null

diagnostics:
  enabled: true
  histogram_bins: 20

model:
  factory: clstrainer_lite.models:build_tiny_model
  kwargs:
    channels: 3
    width: 32
    num_classes: 2
  init_weights: null

train:
  epochs: 10
  batch_size: 64
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  min_learning_rate: 0.00001
  gradient_clip_norm: 5.0
  decision_threshold: 0.5
  log_every_steps: 50
  n_val_step: 500
  n_test_step: 2000

runtime:
  accelerator: cpu
  backend: gloo
  amp: false
  amp_dtype: bfloat16
  find_unused_parameters: true
