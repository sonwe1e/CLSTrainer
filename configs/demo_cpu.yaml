experiment:
  name: demo
  output_dir: runs
  seed: 123

data:
  backend: image
  image:
    train_root: demo_data/train
    test_root: demo_data/test
    strict_filenames: true
  video:
    train_root: null
    test_root: null
    extensions: [".mp4"]
    chunk_frames: 32
    cache_chunks: 1
    ffmpeg_bin: ffmpeg
    ffprobe_bin: ffprobe
    ffmpeg_threads: 1
  val_ratio: 0.25
  train_delta_range: [1, 1]
  train_delta_probabilities: null
  eval_delta: 1
  image_size: [32, 48]

augment:
  enabled: false
  horizontal_flip_p: 0.0
  crop_scale: [1.0, 1.0]
  brightness: 0.0
  contrast: 0.0
  saturation: 0.0
  gamma: [1.0, 1.0]
  color_shared: true
  noise_std: 0.0
  erase_p: 0.0
  erase_scale: [0.02, 0.10]

loss:
  type: cross_entropy
  gamma: 1.5
  alpha: null

sampler:
  enabled: false
  class_probability: [0.5, 0.5]
  game_balance_alpha: 0.5
  samples_per_epoch: null

diagnostics:
  enabled: true
  histogram_bins: 20

model:
  factory: clstrainer_lite.models:build_tiny_model
  kwargs:
    width: 8
  init_weights: null

train:
  epochs: 2
  batch_size: 8
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: false
  learning_rate: 0.01
  weight_decay: 0.0001
  scheduler: none
  min_learning_rate: 0.00001
  gradient_clip_norm: 5.0
  decision_threshold: 0.5
  log_every_steps: 2
  n_val_step: 2
  n_test_step: 3

runtime:
  accelerator: cpu
  backend: gloo
  amp: false
  amp_dtype: bfloat16
  find_unused_parameters: true
