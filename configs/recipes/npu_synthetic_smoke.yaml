# Data-free NPU preflight (step6 P0-4).
#
# The production recipe (configs/recipes/game_cls_production.yaml) points at
# production indexes, checkpoints and a real dataset, so it can only run on a
# runner that has already been provisioned. That made the NPU workflow
# unrepeatable: a fresh Ascend host could not tell "the NPU stack is broken"
# from "this box has no data".
#
# This recipe keeps the npu accelerator, HCCL and BF16 autocast paths but
# swaps in the synthetic dataset, so any Ascend runner can execute it. It
# proves the device, the operators, DDP and save/resume work; it says nothing
# about model quality and must never gate a release on its own. The machine
# flavor comes from the profile: npu_1p here; override `profile=npu_8p` for
# the HCCL/DDP path.
profile: npu_1p

experiment:
  name: npu_synthetic_smoke
  output_dir: runs/npu_synthetic_smoke

data:
  synthetic: true
  # Synthetic data has no on-disk provenance to audit and no independent
  # test root, so the production audit contract cannot apply here.
  strict_audit: false
  require_content_hash_audit: false
  require_unique_video_keys_across_splits: false
  require_independent_test: false
  prepare_if_missing: false
  backend: png
  hard_negative:
    enabled: false

model:
  # game_cls_production.yaml ships a placeholder factory that only resolves
  # once the deployment model is wired in. The preflight must run on a bare
  # runner, so it uses the in-repo demo model: this tier proves the NPU
  # stack (operators, BF16, HCCL, DDP, save/resume), not the real network.
  factory: game_cls.model.builder:build_demo_model
  # No production checkpoint on a bare runner.
  checkpoint_path: null

evaluation:
  # Subtype grouping needs a metadata sidecar, which synthetic data has not.
  group_by_negative_subtype: false
  max_worst_subtype_fpr: null
  train_probe_every_steps: 0
  val_quick_every_steps: 10
  val_quick_pairs_per_video: 2
  val_full_every_steps: 20
  val_full_at_end: false

train:
  epochs: 1
  steps_per_epoch: 20
  max_steps: 20
  log_every_steps: 5
  local_batch_size: 4

dataloader:
  train:
    num_workers: 1
  eval:
    num_workers: 0

checkpoint:
  save_last_every_steps: 10
