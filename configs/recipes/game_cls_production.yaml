# Production recipe template. Fill the REPLACE_ME fields, then:
#
#   cls-trainer doctor --config configs/recipes/game_cls_production.yaml
#   cls-trainer train  --config configs/recipes/game_cls_production.yaml --dry-run
#   cls-trainer train  --config configs/recipes/game_cls_production.yaml
#
# Business facts (threshold 0.99, delta=2 test pairs, cls-only training,
# 448x208 frames) come from the task profile and are intentionally absent here.
# NPU spawn/timeout/worker rules come from the profile.
profile: npu_8p

presets:
  augmentation: standard
  dataloader: stable
  evaluation: production

experiment:
  name: game_cls_v1
  seed: 20260728
  output_dir: runs/game_cls

model:
  factory: REPLACE_ME_PACKAGE.module:build_model
  checkpoint_path: REPLACE_ME/path/to/base_model.pt

data:
  # Optional: derive the validation split from a single source root instead
  # of pre-built val_frames.parquet. Uncomment to enable, then run
  #   cls-trainer dataset prepare --config configs/recipes/game_cls_production.yaml --train-root <train_all> --test-root <test>
  # or set prepare_if_missing: true to auto-derive before training.
  # source_root: /data/train_all
  # test_root: /data/test
  # prepare_if_missing: true
  # split:
  #   mode: from_train
  #   val_ratio: 0.10
  #   seed: 20260728
  prepare_if_missing: false
  synthetic: false
  require_content_hash_audit: true
  require_unique_video_keys_across_splits: true
  require_independent_test: true
  minimum_pairs_per_game_label_delta: {2: 1}
  audit_path: indexes/audit.json
  train_video_index: indexes/train_video_entries.parquet
  val_video_index: indexes/val_video_entries.parquet
  test_video_index: indexes/test_video_entries.parquet
  train_index: indexes/train_frames.parquet
  val_index: indexes/val_frames.parquet
  test_index: indexes/test_frames.parquet
  backend: png
  frame_extensions: [".png"]
  ignore_directory_prefixes: ["_", "."]
  ignore_directory_names: ["__pycache__", "cache", "caches", "tmp", "temp"]
  ignore_file_globs: ["*.tmp", "*.part", "*.log"]
  unexpected_nested_directory_severity: warning
  ignored_example_limit: 20
  duplicate_policy:
    same_label_cross_split: error
    same_label_within_split: warning
    cross_label_same_content: error
    same_basename: info

pair:
  train_delta_probability: {1: 0.15, 2: 0.70, 3: 0.15}

sampler:
  game_alpha: 0.25
  class_probability: {0: 0.5, 1: 0.5}
  deduplicate_within_global_batch: true

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  warmup_steps: 500
  min_learning_rate: 0.00001

train:
  epochs: 10
  steps_per_epoch: 1000
  max_steps: null
  stop_after_steps: null
  resume_path: null
  verify_frozen_parameters: false
  local_batch_size: 64
  gradient_clip_norm: 5.0
  log_every_steps: 50

# Low-FPR constrained selection (step4 §三.3), overriding the composite
# selection of the evaluation/production preset. The decision threshold
# stays decision.threshold (0.99); metrics use neutral names.
evaluation:
  selection_mode: constrained
  max_global_fpr: 0.01
  max_worst_game_fpr: 0.02
  min_positive_recall: 0.8
  max_fpr_for_recall: 0.01
  tail_calibration_enabled: true

checkpoint:
  save_last_every_steps: 1000
  save_best_selection: true
  save_best_val_loss: true
  save_best_worst_game: true
  periodic_state_mode: trainable_only
  full_model_every_steps: 5000

# Stop on validation plateau instead of always consuming max_steps.
early_stopping:
  enabled: true
  monitor: selection_score
  mode: max
  full_validation_only: true
  burn_in_steps: 6000
  patience_evaluations: 3
  min_delta: 0.001
  restore_best: true
