experiment:
  name: dual_frame_game_cls_npu
  seed: 20260728
  output_dir: runs/dual_frame_game_cls_npu

device:
  accelerator: npu
  amp: true
  amp_dtype: bfloat16

data:
  synthetic: false
  strict_audit: true
  require_content_hash_audit: true
  require_unique_video_keys_across_splits: false
  minimum_pairs_per_game_label_delta: {2: 1}
  audit_path: indexes/audit.json
  train_video_index: indexes/train_video_entries.parquet
  test_video_index: indexes/test_video_entries.parquet
  train_index: indexes/train_frames.parquet
  test_index: indexes/test_frames.parquet
  backend: png
  train_packed_index: null
  test_packed_index: null
  train_packed_video_index: null
  test_packed_video_index: null
  packed_max_open_shards: 16
  width: 208
  height: 448

pair:
  train_delta_probability: {1: 0.15, 2: 0.70, 3: 0.15}
  test_delta: 2

sampler:
  game_alpha: 0.25
  class_probability: {0: 0.5, 1: 0.5}
  deduplicate_within_global_batch: true

augmentation:
  enabled: true
  random_affine:
    enabled: true
    probability: 0.50
    degrees: 2.0
    translate: [0.02, 0.02]
    scale: [0.98, 1.02]
    shear: [-1.0, 1.0]
    interpolation: bilinear
    fill: 0
  color_jitter:
    enabled: true
    probability: 0.80
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
    hue: 0.02
  random_erasing:
    enabled: true
    probability: 0.10
    scale: [0.005, 0.03]
    ratio: [0.3, 3.3]
    value: 0

model:
  factory: your_package.your_module:build_model
  checkpoint_path: null
  trainable_name_contains: cls
  num_classes: 2
  freeze_backbone_batchnorm_stats: true
  freeze_cls_batchnorm_stats: true
  require_pretrained_backbone: true

loss:
  cross_entropy_weight: 1.0
  threshold: 0.99
  threshold_loss_weight: 0.20
  threshold_safety_margin: 0.20
  threshold_temperature: 0.50
  threshold_warmup_ratio: 0.10
  threshold_ramp_ratio: 0.20

optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: cosine
  warmup_steps: 500
  min_learning_rate: 0.00001

train:
  epochs: 10
  steps_per_epoch: 1000
  max_steps: null
  stop_after_steps: null
  resume_path: null
  verify_frozen_parameters: false
  local_batch_size: 64
  gradient_clip_norm: 5.0
  log_every_steps: 50

dataloader:
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true

evaluation:
  threshold: 0.99
  amp: true
  amp_dtype: bfloat16
  quick_test_every_steps: 1000
  quick_test_pairs_per_video: 128
  full_test_every_steps: 5000
  full_test_at_end: true
  full_auc_mode: histogram
  auc_histogram_bins: 4096
  quick_save_error_limit: 200
  html_max_errors_per_group: 200
  parquet_row_group_size: 4096
  selection_metric: composite
  selection_weights:
    global_f1: 0.40
    macro_game_f1: 0.40
    worst_game_f1: 0.20
  minimum_worst_game_f1: null

checkpoint:
  save_last_every_steps: 1000
  save_best_selection: true
  periodic_state_mode: trainable_only
  full_model_every_steps: 5000
