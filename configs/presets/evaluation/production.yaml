# Production evaluation policy: train/validation/test protocol.
#
# Cadence recommendation (step2 plan): with the overfitting knee around
# 10k steps, full validation every 2000 steps resolves 8k/10k/12k; the
# old 5000-step cadence could only see 5k/10k/15k.
evaluation:
  train_probe_every_steps: 1000
  train_probe_pairs_per_video: 32
  val_quick_every_steps: 500
  val_quick_pairs_per_video: 128
  val_full_every_steps: 2000
  val_full_at_end: true
  tensorboard_live: false
  full_auc_mode: histogram
  auc_histogram_bins: 4096
  quick_save_error_limit: 200
  html_max_errors_per_group: 200
  parquet_row_group_size: 4096
  selection_metric: composite
  selection_weights:
    global_f1: 0.40
    macro_game_f1: 0.40
    worst_game_f1: 0.20
  minimum_worst_game_f1: null
