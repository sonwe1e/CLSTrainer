# Production evaluation policy: train/validation/test protocol.
#
# Cadence recommendation (step2 plan): with the overfitting knee around
# 10k steps, full validation every 2000 steps resolves 8k/10k/12k; the
# old 5000-step cadence could only see 5k/10k/15k.
#
# Low-FPR constrained selection (step4 §三.3) lives here as the single
# source of truth: production recipes no longer repeat these keys. The
# decision threshold stays decision.threshold (0.99); metrics use neutral
# names.
evaluation:
  train_probe_every_steps: 1000
  train_probe_pairs_per_video: 32
  val_quick_every_steps: 500
  val_quick_pairs_per_video: 128
  val_full_every_steps: 2000
  val_full_at_end: true
  tensorboard_live: false
  full_auc_mode: histogram
  auc_histogram_bins: 4096
  quick_save_error_limit: 200
  html_max_errors_per_group: 200
  parquet_row_group_size: 4096
  # Audit P1-4: under selection_mode: constrained the rank key is
  # (global recall, worst-game recall, -negative p99.9) and the composite F1
  # weights are dead config -- they could not influence the best checkpoint.
  # The dead keys were removed; a config that re-adds them alongside
  # constrained mode is rejected by semantic validation.
  minimum_worst_game_f1: null
  selection_mode: constrained
  max_global_fpr: 0.01
  max_worst_game_fpr: 0.02
  min_positive_recall: 0.8
  max_fpr_for_recall: 0.01
  tail_calibration_enabled: true
