# Smoke evaluation policy: frequent cheap checks for short acceptance runs.
evaluation:
  train_probe_every_steps: 10
  train_probe_pairs_per_video: 2
  val_quick_every_steps: 10
  val_quick_pairs_per_video: 2
  val_full_every_steps: 0
  val_full_at_end: false
  quick_save_error_limit: 50
  html_max_errors_per_group: 50
