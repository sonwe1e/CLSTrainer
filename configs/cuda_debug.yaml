experiment:
  name: dual_frame_game_cls_debug
  seed: 20260728
  output_dir: runs/dual_frame_game_cls_debug

device:
  accelerator: auto
  amp: false
  amp_dtype: float16

data:
  synthetic: true
  train_index: indexes/train_frames.parquet
  test_index: indexes/test_frames.parquet
  width: 208
  height: 448

pair:
  train_delta_probability: {1: 0.15, 2: 0.70, 3: 0.15}
  test_delta: 2

sampler:
  game_alpha: 0.25
  class_probability: {0: 0.5, 1: 0.5}
  deduplicate_within_global_batch: true

augmentation:
  enabled: true
  random_affine:
    enabled: true
    probability: 0.50
    degrees: 2.0
    translate: [0.02, 0.02]
    scale: [0.98, 1.02]
    shear: [-1.0, 1.0]
  color_jitter:
    enabled: true
    probability: 0.80
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
    hue: 0.02
  random_erasing:
    enabled: true
    probability: 0.10
    scale: [0.005, 0.03]
    ratio: [0.3, 3.3]
    value: random

model:
  factory: game_cls.model.builder:build_demo_model
  checkpoint_path: null
  trainable_name_contains: cls
  num_classes: 2
  freeze_batchnorm_stats: true

loss:
  cross_entropy_weight: 1.0
  threshold: 0.99
  threshold_loss_weight: 0.20
  threshold_safety_margin: 0.20
  threshold_temperature: 0.50
  threshold_warmup_ratio: 0.10
  threshold_ramp_ratio: 0.20

optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: cosine
  warmup_steps: 10
  min_learning_rate: 0.00001

train:
  epochs: 1
  steps_per_epoch: 100
  max_steps: 100
  resume_path: null
  verify_frozen_parameters: true
  local_batch_size: 4
  gradient_clip_norm: 5.0
  log_every_steps: 10

dataloader:
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: false

evaluation:
  threshold: 0.99
  quick_test_every_steps: 50
  quick_test_pairs_per_video: 16
  full_test_every_steps: 100
  full_test_at_end: true

checkpoint:
  save_last_every_steps: 50
  save_best_test_f1: true
