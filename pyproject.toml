[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-cls"
version = "5.0.0"
description = "Dual-frame multi-game binary classification trainer"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8.0", "torch>=2.2", "torchvision>=0.17"]

[project.scripts]
cls-trainer = "game_cls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Audit PR-F: ship the recipe/profile/preset config tree inside the wheel so a
# clean venv install (no repo checkout, no ./configs) can run
# `init -> config validate -> synthetic train`. game_cls.config._configs_root()
# falls back to this installed tree when CWD ./configs is absent.
[tool.setuptools.data-files]
"game_cls/configs/task_profiles" = ["configs/task_profiles/*.yaml"]
"game_cls/configs/profiles" = ["configs/profiles/*.yaml"]
"game_cls/configs/recipes" = ["configs/recipes/*.yaml"]
"game_cls/configs/presets/augmentation" = ["configs/presets/augmentation/*.yaml"]
"game_cls/configs/presets/dataloader" = ["configs/presets/dataloader/*.yaml"]
"game_cls/configs/presets/evaluation" = ["configs/presets/evaluation/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter review, not hard errors
    "SIM108", # ternary instead of if/else; often less readable
    "B008",   # function calls in argument defaults (torch APIs rely on it)
]

[tool.mypy]
python_version = "3.11"
files = ["src/game_cls"]
ignore_missing_imports = true
warn_unused_configs = true
